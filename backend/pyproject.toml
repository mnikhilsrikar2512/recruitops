[project]
name = "recruitment-system-fastapi"
version = "0.1.0"
description = "FastAPI backend foundation for the recruitment system"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.0,<1.0.0",
  "uvicorn[standard]>=0.35.0,<1.0.0",
  "sqlalchemy>=2.0.40,<3.0.0",
  "pydantic-settings>=2.10.0,<3.0.0",
  "email-validator>=2.2.0,<3.0.0",
  "pyodbc>=5.2.0,<6.0.0",
  "python-multipart>=0.0.9,<1.0.0",
  "aiosmtplib>=3.0.0,<4.0.0",
  "bcrypt>=4.0.0,<5.0.0",
  "pyjwt>=2.8.0,<3.0.0",
  "redis>=5.0.0,<7.0.0",
  "boto3>=1.34.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0,<9.0.0",
  "httpx>=0.28.0,<1.0.0",
  "ruff>=0.12.0,<1.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
