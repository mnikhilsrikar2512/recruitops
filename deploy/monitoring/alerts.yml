# RecruitOps alert rules (Prometheus format: Prometheus, Grafana Cloud/Mimir,
# Azure Managed Prometheus, Amazon Managed Prometheus all load this file).
# Scrape: GET http://<api>:8000/metrics with "Authorization: Bearer $METRICS_TOKEN",
# job="recruitops-api". Targets and SLOs: docs/runbooks/monitoring.md.
groups:
  - name: recruitops-slo
    rules:
      # 5xx share of all requests: the availability SLO (99.5%) burns at
      # 14.4x when 7.2% of requests fail; page fast on that, ticket on slow burn.
      - record: recruitops:http_5xx_ratio:rate5m
        expr: |
          sum(rate(recruitops_http_requests_total{status_class="5xx"}[5m]))
          / clamp_min(sum(rate(recruitops_http_requests_total[5m])), 1e-9)
      - record: recruitops:http_5xx_ratio:rate1h
        expr: |
          sum(rate(recruitops_http_requests_total{status_class="5xx"}[1h]))
          / clamp_min(sum(rate(recruitops_http_requests_total[1h])), 1e-9)

      - alert: RecruitOpsErrorBudgetFastBurn
        expr: recruitops:http_5xx_ratio:rate5m > (14.4 * 0.005) and recruitops:http_5xx_ratio:rate1h > (14.4 * 0.005)
        for: 2m
        labels: { severity: page }
        annotations:
          summary: "API 5xx rate {{ $value | humanizePercentage }}: the monthly error budget burns in ~2 days"
          runbook: docs/runbooks/monitoring.md#errors

      - alert: RecruitOpsErrorBudgetSlowBurn
        expr: recruitops:http_5xx_ratio:rate1h > (3 * 0.005)
        for: 30m
        labels: { severity: ticket }
        annotations:
          summary: "API 5xx rate {{ $value | humanizePercentage }} over the last hour"
          runbook: docs/runbooks/monitoring.md#errors

      - alert: RecruitOpsReadLatencyHigh
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(recruitops_http_request_duration_seconds_bucket{method="GET", route!~".*/reports/.*"}[10m]))) > 0.4
        for: 15m
        labels: { severity: ticket }
        annotations:
          summary: "p95 read latency {{ $value | humanizeDuration }} (target < 400 ms)"
          runbook: docs/runbooks/monitoring.md#latency

      - alert: RecruitOpsWriteLatencyHigh
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(recruitops_http_request_duration_seconds_bucket{method=~"POST|PUT|PATCH|DELETE"}[10m]))) > 0.8
        for: 15m
        labels: { severity: ticket }
        annotations:
          summary: "p95 write latency {{ $value | humanizeDuration }} (target < 800 ms)"
          runbook: docs/runbooks/monitoring.md#latency

      - alert: RecruitOpsReportLatencyHigh
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(recruitops_http_request_duration_seconds_bucket{route=~".*/reports/.*"}[30m]))) > 2
        for: 30m
        labels: { severity: ticket }
        annotations:
          summary: "p95 report latency {{ $value | humanizeDuration }} (target < 2 s)"
          runbook: docs/runbooks/monitoring.md#latency

  - name: recruitops-health
    rules:
      - alert: RecruitOpsApiDown
        expr: up{job="recruitops-api"} == 0
        for: 2m
        labels: { severity: page }
        annotations:
          summary: "The API is not answering /metrics on {{ $labels.instance }}"
          runbook: docs/runbooks/monitoring.md#down

      - alert: RecruitOpsEmailFailing
        expr: |
          sum(increase(recruitops_emails_total{result="failed"}[30m])) > 3
          and sum(increase(recruitops_emails_total{result="sent"}[30m])) == 0
        for: 5m
        labels: { severity: page }
        annotations:
          summary: "Every email in the last 30 minutes failed: sign-up, invites and password resets are stuck"
          runbook: docs/runbooks/monitoring.md#email

      - alert: RecruitOpsNoTraffic
        expr: sum(rate(recruitops_http_requests_total[30m])) == 0
        for: 30m
        labels: { severity: ticket }
        annotations:
          summary: "No API requests for 30 minutes during an expected-traffic window"
          runbook: docs/runbooks/monitoring.md#down
