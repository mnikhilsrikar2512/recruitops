# Production-like RecruitOps stack on one machine.
#
#   cp deploy/compose/staging.env.example deploy/compose/staging.env
#   python3 deploy/compose/gen_secrets.py deploy/compose/staging.env
#   docker compose -f deploy/compose/docker-compose.yml --env-file deploy/compose/staging.env up -d --build
#   deploy/compose/smoke/run.sh          # optional: 50+ end-to-end checks
#
#   App:     https://localhost:8443/pages/signup.html  (self-signed certificate)
#   Email:   http://localhost:8025                    (every outgoing email lands here)
#   Files:   S3-compatible store (SeaweedFS) on http://s3.localhost:8333
#
# The same images run in the cloud; there the database, Redis, bucket and
# email come from managed services and only api / web / scheduler / migrate run.

name: recruitops

x-api-env: &api-env
  env_file: [staging.env]

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?run gen_secrets.py}
      MSSQL_PID: Developer
    volumes: [sqldata:/var/opt/mssql]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5

  clamav:
    image: clamav/clamav:1.4
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s

  s3:
    # S3-compatible object store (SeaweedFS). Presigned download links point
    # at http://s3.localhost:8333, which the browser resolves to this machine.
    image: chrislusf/seaweedfs:3.80
    environment:
      S3_ACCESS_KEY_ID: recruitops
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?run gen_secrets.py}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '{"identities":[{"name":"recruitops","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' \
          "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" > /tmp/s3.json
        exec weed server -dir=/data -ip=s3 -s3 -s3.port=8333 -s3.config=/tmp/s3.json -master.volumeSizeLimitMB=256 -volume.max=0
    volumes: [s3data:/data]
    ports: ["127.0.0.1:8333:8333"]
    networks:
      default:
        aliases: [s3.localhost]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/status || wget -q -S -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -q 'HTTP/'"]
      interval: 10s
      retries: 15
      start_period: 15s

  s3-init:
    # Creates the private bucket (the API image already has boto3).
    image: recruitops-api:local
    <<: *api-env
    depends_on:
      s3: { condition: service_healthy }
      migrate: { condition: service_started }
    entrypoint: ["python", "-c"]
    command:
      - |
        import os, boto3, botocore
        s3 = boto3.client("s3", endpoint_url=os.environ["S3_ENDPOINT_URL"], region_name=os.environ["S3_REGION"],
                          aws_access_key_id=os.environ["S3_ACCESS_KEY_ID"], aws_secret_access_key=os.environ["S3_SECRET_ACCESS_KEY"])
        bucket = os.environ["S3_BUCKET"]
        try:
            s3.create_bucket(Bucket=bucket)
        except botocore.exceptions.ClientError as exc:
            if exc.response["Error"]["Code"] not in ("BucketAlreadyOwnedByYou", "BucketAlreadyExists"):
                raise
        try:  # production buckets must have versioning on (docs/runbooks/backup-restore.md)
            s3.put_bucket_versioning(Bucket=bucket, VersioningConfiguration={"Status": "Enabled"})
        except botocore.exceptions.ClientError as exc:
            print("note: this local store doesn't support versioning:", exc.response["Error"]["Code"])
        print("bucket ready:", bucket)
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.27
    environment:
      MP_SMTP_TLS_CERT: sans:mailpit
      MP_SMTP_TLS_KEY: sans:mailpit
      MP_SMTP_REQUIRE_STARTTLS: "true"
    ports: ["127.0.0.1:8025:8025"]

  migrate:
    build: { context: ../.., dockerfile: backend/Dockerfile }
    image: recruitops-api:local
    <<: *api-env
    command: ["migrate", "--create-db"]
    depends_on: { sqlserver: { condition: service_healthy } }
    restart: "no"

  api:
    image: recruitops-api:local
    <<: *api-env
    command: ["api"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      clamav: { condition: service_healthy }
      s3-init: { condition: service_completed_successfully }
    read_only: true
    tmpfs: ["/tmp"]
    restart: unless-stopped

  scheduler:
    # The ops image (API image + sqlpackage) also runs backups and restore drills.
    build: { context: ../.., dockerfile: backend/Dockerfile, target: ops }
    image: recruitops-ops:local
    <<: *api-env
    command: ["scheduler"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    read_only: true
    tmpfs: ["/tmp"]
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/recruitops/scheduler-heartbeat -mmin -3 | grep -q ."]
      interval: 60s
      start_period: 60s
    restart: unless-stopped

  web:
    build: { context: ../.., dockerfile: frontend/Dockerfile }
    image: recruitops-web:local
    environment:
      API_UPSTREAM: api:8000
    depends_on: { api: { condition: service_healthy } }
    read_only: true
    # tmpfs owned by the nginx user (101): the entrypoint renders the config into conf.d.
    tmpfs: ["/tmp:uid=101,gid=101", "/var/cache/nginx:uid=101,gid=101", "/etc/nginx/conf.d:uid=101,gid=101"]
    restart: unless-stopped

  edge:
    image: caddy:2.9-alpine
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    ports: ["127.0.0.1:8443:8443"]
    depends_on: [web]
    restart: unless-stopped

volumes:
  sqldata:
  s3data:
  caddydata:
