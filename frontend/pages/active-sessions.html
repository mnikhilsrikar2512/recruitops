<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Active sessions — RecruitOps</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../shared/global.css?v=aa817b0f1c" />
  <link rel="stylesheet" href="../shared/visual-system.css?v=aa817b0f1c" />
  <link rel="stylesheet" href="../shared/landing.css?v=aa817b0f1c" />
  <style>
    .login-split { display:flex; min-height:100vh; }
    .login-left { flex:1; background:linear-gradient(135deg,#1e293b 0%,#0f172a 100%); display:flex; flex-direction:column; justify-content:center; padding:48px; position:relative; overflow:hidden; }
    .login-right { flex:1; display:flex; align-items:center; justify-content:center; padding:24px; }
    .login-back-home:hover { color:#1e293b; }
    @media(max-width:1024px){ .login-left{display:none;} }
  </style>
  <link rel="stylesheet" href="../shared/fonts/fonts.css?v=aa817b0f1c" />
  <link rel="stylesheet" href="../shared/tailwind.css?v=aa817b0f1c" />
</head>
<body data-route-id="active-sessions" data-route-kind="app" data-route-title="Active sessions" data-route-section="Account">
  <main>
    <div class="login-right" style="min-height:100vh">
      <div style="width:100%;max-width:480px">
        <div class="bg-surface border border-border rounded-lg" style="box-shadow:0 4px 24px rgba(39,48,56,0.06)">
          <div style="padding:20px 24px;border-bottom:1px solid #E7E7E4">
            <h2 style="font-size:20px;font-weight:700;color:#17201C">Where you're signed in</h2>
            <p style="font-size:13px;color:#6E7476;margin-top:4px">Sign out any device you don't recognise. Signing out ends that device's session immediately.</p>
          </div>
          <div style="padding:24px;position:relative">
            <p class="hidden" role="alert" id="mfa-message" style="font-size:13px;padding:10px 12px;border-radius:4px;margin-bottom:16px"></p>
            <ul id="session-list" style="list-style:none;padding:0;margin:0 0 16px 0;font-size:13px;color:#17201C"><li>Loading…</li></ul>
            <button type="button" id="sign-out-others" style="width:100%;background:#1e293b;color:#fff;border:none;padding:12px;border-radius:4px;font-size:13px;font-weight:600;cursor:pointer">Sign out all other devices</button>
            <a href="my-profile.html" style="display:block;margin-top:16px;font-size:12px;color:#1e293b">Back to My Profile</a>
          </div>
        </div>
      </div>
    </div>
  </main>
  <script src="../shared/renderers.js?v=aa817b0f1c"></script>
  <script src="../shared/api-client.js?v=aa817b0f1c"></script>
    <script src="../shared/ui-utils.js?v=aa817b0f1c"></script>
    <script src="../shared/tables.js?v=aa817b0f1c"></script>
    <script src="../shared/forms.js?v=aa817b0f1c"></script>
    <script src="../shared/sidebar.js?v=aa817b0f1c"></script>
    <script src="../shared/pipeline.js?v=aa817b0f1c"></script>
    <script src="../shared/routing.js?v=aa817b0f1c"></script>

  <script src="../shared/app.js?v=aa817b0f1c"></script>

  <script>
  (function () {
    function say(text, ok) {
      var el = document.getElementById("mfa-message");
      el.textContent = text;
      el.classList.remove("hidden");
      el.style.background = ok ? "#EAF3EC" : "#FBECEA";
      el.style.color = ok ? "#2F5A3A" : "#8A2E22";
    }
    function esc(value) {
      return String(value == null ? "" : value).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }
    var list = document.getElementById("session-list");
    function when(value) { return value ? new Date(value).toLocaleString() : "—"; }
    async function load() {
      try {
        var data = await apiRequest("/auth/sessions");
        var items = data.items || [];
        if (!items.length) { list.innerHTML = "<li>No active sessions.</li>"; return; }
        list.innerHTML = items.map(function (s) {
          return '<li style="padding:10px 0;border-bottom:1px solid #E7E7E4;display:flex;justify-content:space-between;gap:12px;align-items:center">'
            + '<span><strong>' + esc((s.user_agent || "Unknown device").slice(0, 60)) + '</strong>'
            + (s.current ? ' <em style="color:#2F5A3A;font-style:normal">(this device)</em>' : '')
            + '<br><span style="color:#6E7476">' + esc(s.ip_address || "") + ' · last active ' + esc(when(s.last_seen_at || s.created_at)) + '</span></span>'
            + (s.current ? '' : '<button type="button" data-session-id="' + esc(s.id) + '" style="font-size:12px;padding:6px 10px;border:1px solid #D6D9D4;border-radius:4px;background:#fff;cursor:pointer">Sign out</button>')
            + '</li>';
        }).join("");
      } catch (error) { list.innerHTML = "<li>" + esc((error && error.detail) || "Couldn't load sessions.") + "</li>"; }
    }
    list.addEventListener("click", async function (event) {
      var button = event.target.closest("[data-session-id]");
      if (!button) return;
      try { await apiRequest("/auth/sessions/" + button.dataset.sessionId, { method: "DELETE" }); say("Signed out.", true); load(); }
      catch (error) { say((error && error.detail) || "Couldn't sign out that device.", false); }
    });
    document.getElementById("sign-out-others").addEventListener("click", async function () {
      try { var result = await apiRequest("/auth/sessions", { method: "DELETE" }); say("Signed out " + result.revoked + " other session(s).", true); load(); }
      catch (error) { say((error && error.detail) || "Couldn't sign out other devices.", false); }
    });
    load();
  })();
  </script>
</body>
</html>
