    <section class="overlay-layout" data-overlay-mount-parent="Offer Management">
      <div class="overlay-underlay"><div class="pointer-events-none p-8 opacity-40"><h2 class="font-headline-lg text-headline-lg text-on-surface">Offer Management</h2><p class="mt-2 font-body-sm text-text-muted">Live records load from the parent workspace.</p></div></div><div class="overlay-backdrop" data-overlay-close></div>
      <div class="overlay-host dialog">
        <div class="bg-surface border border-border rounded-lg shadow-[0px_4px_12px_rgba(39,48,56,0.08)] w-full max-w-2xl flex flex-col overflow-hidden max-h-[90vh] max-h-[calc(100vh-48px)]" data-overlay-surface="true">
          <!-- Header -->
          <div class="flex items-center justify-between px-inset-card py-stack-default border-b border-border bg-surface-alt">
            <div>
              <h2 class="font-headline-sm text-headline-sm text-on-surface">Create Offer</h2>
              <p class="font-body-sm text-body-sm text-text-muted mt-1">Record the offer for the selected candidate application.</p>
            </div>
            <button class="text-text-muted hover:text-on-surface transition-colors p-1" type="button" data-overlay-close="true" aria-label="Close overlay" title="Close overlay"> <span class="material-symbols-outlined" data-icon="close">close</span> </button>
          </div>
          <!-- Content Body -->
          <div class="p-inset-card flex flex-col gap-gutter overflow-y-auto">
            <!-- Candidate Info (filled from the application) -->
            <div class="flex items-center gap-3 p-stack-default border border-border rounded bg-surface-container-lowest" data-offer-candidate>
              <div class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center flex-shrink-0">
                <span class="font-body-sm text-body-sm text-on-primary font-semibold" data-offer-candidate-initials>—</span>
              </div>
              <div class="flex flex-col min-w-0">
                <span class="font-body-md text-body-md text-on-surface font-medium truncate" data-offer-candidate-name>—</span>
                <span class="font-body-sm text-body-sm text-text-muted truncate" data-offer-candidate-meta>—</span>
              </div>
            </div>
            <!-- Compensation Section -->
            <div class="flex flex-col gap-stack-default border-t border-border pt-gutter">
              <div class="flex items-center gap-2">
                <span class="material-symbols-outlined text-primary text-xl" data-icon="payments">payments</span>
                <span class="font-body-md text-body-md text-on-surface font-medium">Compensation</span>
              </div>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-stack-default">
                <div class="flex flex-col gap-1">
                  <label class="font-label-caps text-label-caps text-on-surface uppercase" for="base_salary">Annual CTC</label>
                  <div class="relative">
                    <span class="absolute left-3 top-1/2 -translate-y-1/2 text-text-muted font-body-md text-body-md whitespace-nowrap select-none pointer-events-none" data-currency-symbol="base_salary">₹</span>
                    <input class="w-full bg-surface-alt border border-border rounded-lg pl-9 pr-3 py-2 font-body-md text-body-md text-on-surface tabular-nums placeholder:text-text-muted focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="base_salary" type="text" inputmode="decimal" placeholder="Total annual CTC"/>
                  </div>
                </div>
                <div class="flex flex-col gap-1">
                  <label class="font-label-caps text-label-caps text-on-surface uppercase" for="currency">Currency</label>
                  <div class="relative">
                    <select class="w-full appearance-none bg-surface-alt border border-border rounded-lg px-3 py-2 pr-8 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors cursor-pointer" id="currency" data-currency-select="true">
                      <option selected="" value="INR">INR (₹)</option>
                      <option value="USD">USD (US$)</option>
                      <option value="EUR">EUR (€)</option>
                      <option value="GBP">GBP (£)</option>
                      <option value="CAD">CAD (C$)</option>
                      <option value="AUD">AUD (A$)</option>
                      <option value="JPY">JPY (¥)</option>
                    </select>
                    <span class="material-symbols-outlined absolute right-2 top-1/2 -translate-y-1/2 text-outline pointer-events-none" data-icon="expand_more">expand_more</span>
                  </div>
                </div>
                <div class="flex flex-col gap-1">
                  <label class="font-label-caps text-label-caps text-on-surface uppercase" for="signing_bonus">Signing Bonus <span class="normal-case font-normal text-text-muted">(optional)</span></label>
                  <div class="relative">
                    <span class="absolute left-3 top-1/2 -translate-y-1/2 text-text-muted font-body-md text-body-md whitespace-nowrap select-none pointer-events-none" data-currency-symbol="signing_bonus">₹</span>
                    <input class="w-full bg-surface-alt border border-border rounded-lg pl-9 pr-3 py-2 font-body-md text-body-md text-on-surface tabular-nums placeholder:text-text-muted focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="signing_bonus" type="text" inputmode="decimal" placeholder="One-time amount"/>
                  </div>
                </div>
                <div class="flex flex-col gap-1">
                  <label class="font-label-caps text-label-caps text-on-surface uppercase" for="start_date">Expected Joining Date</label>
                  <input class="w-full bg-surface-alt border border-border rounded-lg px-3 py-2 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="start_date" type="date"/>
                </div>
              </div>
            </div>
            <!-- Notes Textarea -->
            <div class="flex flex-col gap-1">
              <label class="font-label-caps text-label-caps text-on-surface uppercase" for="notes">Notes</label>
              <textarea class="w-full bg-surface-alt border border-border rounded-lg px-3 py-2 font-body-md text-body-md text-on-surface placeholder:text-text-muted focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors resize-none" id="notes" placeholder="Additional notes for the offer..." rows="3" maxlength="1000"></textarea>
            </div>
          </div>
          <!-- Footer Actions -->
          <div class="flex items-center justify-end gap-stack-default px-inset-card py-stack-default border-t border-border bg-surface-alt">
            <button class="px-4 py-2 border border-border rounded bg-surface text-secondary font-body-md text-body-md hover:bg-highlight-soft transition-colors" type="button" data-overlay-close="true" title="Cancel and close overlay"> Cancel </button>
            <button class="px-4 py-2 bg-primary-container text-on-primary rounded font-body-md text-body-md font-medium hover:bg-primary-hover transition-colors flex items-center gap-2" type="button"> <span class="material-symbols-outlined text-lg" data-icon="send">send</span> Create Offer </button>
          </div>
        </div>
      </div>
    </section>
  
          </div>
        </main>
      </div>
