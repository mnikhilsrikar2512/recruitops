<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Two-step verification — RecruitOps</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../shared/global.css?v=2f7e76bef4" />
  <link rel="stylesheet" href="../shared/visual-system.css?v=2f7e76bef4" />
  <link rel="stylesheet" href="../shared/landing.css?v=2f7e76bef4" />
  <style>
    .login-split { display:flex; min-height:100vh; }
    .login-left { flex:1; background:linear-gradient(135deg,#3F5D43 0%,#2E4530 100%); display:flex; flex-direction:column; justify-content:center; padding:48px; position:relative; overflow:hidden; }
    .login-right { flex:1; display:flex; align-items:center; justify-content:center; padding:24px; }
    .login-back-home:hover { color:#3F5D43; }
    @media(max-width:1024px){ .login-left{display:none;} }
  </style>
  <link rel="stylesheet" href="../shared/fonts/fonts.css?v=2f7e76bef4" />
  <link rel="stylesheet" href="../shared/tailwind.css?v=2f7e76bef4" />
</head>
<body data-route-id="mfa-challenge" data-route-kind="auth" data-route-title="Two-step verification" data-route-section="Authentication">
  <main>
    <div class="login-right" style="min-height:100vh">
      <div style="width:100%;max-width:480px">
        <div class="bg-surface border border-border rounded-lg" style="box-shadow:0 4px 24px rgba(39,48,56,0.06)">
          <div style="padding:20px 24px;border-bottom:1px solid #E7E7E4">
            <h2 style="font-size:20px;font-weight:700;color:#17201C">Two-step verification</h2>
            <p style="font-size:13px;color:#726F66;margin-top:4px">Enter the 6-digit code from your authenticator app.</p>
          </div>
          <div style="padding:24px;position:relative">
            <p class="hidden" role="alert" id="mfa-message" style="font-size:13px;padding:10px 12px;border-radius:4px;margin-bottom:16px"></p>
            <form id="mfa-challenge-form" class="flex flex-col gap-4">
              <label style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:#726F66" for="mfa-code">Code</label>
              <input id="mfa-code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" style="width:100%;padding:10px 12px;border:1px solid #D6D9D4;border-radius:4px;font-size:16px;letter-spacing:0.15em" />
              <details><summary style="font-size:13px;color:#4B5257;cursor:pointer">Use a recovery code instead</summary>
                <input id="mfa-recovery" name="recovery_code" autocomplete="off" placeholder="xxxx-xxxx" style="width:100%;padding:10px 12px;border:1px solid #D6D9D4;border-radius:4px;font-size:16px;letter-spacing:0.15em;margin-top:8px;letter-spacing:0.05em" />
              </details>
              <button type="submit" id="mfa-submit" style="width:100%;background:#3F5D43;color:#fff;border:none;padding:12px;border-radius:4px;font-size:13px;font-weight:600;cursor:pointer">Verify and sign in</button>
              <a href="login.html" style="font-size:12px;color:#3F5D43;text-align:center">Start over</a>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>
  <script src="../shared/landing.js?v=2f7e76bef4"></script>
  <script src="../shared/renderers.js?v=2f7e76bef4"></script>
  <script src="../shared/api-client.js?v=2f7e76bef4"></script>
    <script src="../shared/ui-utils.js?v=2f7e76bef4"></script>
    <script src="../shared/tables.js?v=2f7e76bef4"></script>
    <script src="../shared/forms.js?v=2f7e76bef4"></script>
    <script src="../shared/sidebar.js?v=2f7e76bef4"></script>
    <script src="../shared/pipeline.js?v=2f7e76bef4"></script>
    <script src="../shared/routing.js?v=2f7e76bef4"></script>

  <script src="../shared/app.js?v=2f7e76bef4"></script>

  <script>
  (function () {
    function say(text, ok) {
      var el = document.getElementById("mfa-message");
      el.textContent = text;
      el.classList.remove("hidden");
      el.style.background = ok ? "#EAF3EC" : "#FBECEA";
      el.style.color = ok ? "#2F5A3A" : "#8A2E22";
    }
    function esc(value) {
      return String(value == null ? "" : value).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }
    var pending = null;
    try { pending = JSON.parse(sessionStorage.getItem("recruitops-mfa") || "null"); } catch (e) { pending = null; }
    var form = document.getElementById("mfa-challenge-form");
    if (!pending || !pending.token) {
      say("Your sign-in step expired. Please sign in again.", false);
      form.querySelector("button").disabled = true;
      return;
    }
    form.addEventListener("submit", async function (event) {
      event.preventDefault();
      var code = document.getElementById("mfa-code").value.trim();
      var recovery = document.getElementById("mfa-recovery").value.trim();
      var body = { mfa_token: pending.token };
      if (recovery) body.recovery_code = recovery; else body.code = code;
      try {
        var data = await apiRequest("/auth/mfa/challenge", { method: "POST", body: body });
        try { sessionStorage.removeItem("recruitops-mfa"); } catch (e) { /* ignore */ }
        await finishSignIn(data, pending.email);
      } catch (error) {
        say(error && error.status === 401 ? "That code didn't work. Check the app and try again." : (error && error.detail) || "Verification failed.", false);
      }
    });
  })();
  </script>
</body>
</html>
