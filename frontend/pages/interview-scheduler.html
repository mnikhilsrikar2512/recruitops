<div>
<h1 class="font-headline-lg text-headline-lg text-on-surface">Interviews</h1>
<p class="mt-1 font-body-sm text-body-sm text-text-muted">Schedule interview rounds and track feedback.</p>
</div>
<button type="button" class="hidden self-start rounded-lg bg-primary px-4 py-2 text-[13px] font-semibold text-on-primary" data-interview-new>Schedule interview</button>
</div>
<form class="mt-gutter hidden grid-cols-1 gap-gutter rounded-lg border border-border bg-surface p-inset-card md:grid-cols-2" data-interview-form novalidate>
<h2 class="font-headline-sm text-headline-sm text-on-surface md:col-span-2">Schedule an interview</h2>
<div class="flex flex-col gap-1 md:col-span-2"><label class="font-label-caps text-label-caps text-on-surface uppercase" for="interview_application">Candidate and requisition</label><select id="interview_application" class="w-full bg-surface border border-border rounded px-3 py-2 font-body-md text-body-md text-on-surface"><option value="">Select…</option></select></div>
<div class="flex flex-col gap-1"><label class="font-label-caps text-label-caps text-on-surface uppercase" for="interview_round_type">Round</label><select id="interview_round_type" class="w-full bg-surface border border-border rounded px-3 py-2 font-body-md text-body-md text-on-surface"><option value="internal">Internal</option><option value="manager">Hiring manager</option><option value="client">Client</option></select></div>
<div class="flex flex-col gap-1"><label class="font-label-caps text-label-caps text-on-surface uppercase" for="interview_round_name">Round name</label><input id="interview_round_name" type="text" maxlength="100" class="w-full bg-surface border border-border rounded px-3 py-2 font-body-md text-body-md text-on-surface" placeholder="e.g. Technical round 1"/></div>
<div class="flex flex-col gap-1"><label class="font-label-caps text-label-caps text-on-surface uppercase" for="interview_when">Date and time</label><input id="interview_when" type="datetime-local" class="w-full bg-surface border border-border rounded px-3 py-2 font-body-md text-body-md text-on-surface"/></div>
<div class="flex flex-col gap-1"><label class="font-label-caps text-label-caps text-on-surface uppercase" for="interview_interviewer">Interviewer</label><select id="interview_interviewer" class="w-full bg-surface border border-border rounded px-3 py-2 font-body-md text-body-md text-on-surface"><option value="">Select…</option></select></div>
<p class="font-body-sm text-body-sm text-danger-text md:col-span-2" role="alert" data-interview-error></p>
<div class="flex justify-end gap-2 md:col-span-2">
<button type="button" class="rounded-lg border border-border px-4 py-2 text-[13px] font-semibold text-on-surface" data-interview-cancel>Cancel</button>
<button type="submit" class="rounded-lg bg-primary px-4 py-2 text-[13px] font-semibold text-on-primary">Schedule</button>
</div>
</form>

<div class="mt-gutter overflow-hidden rounded-lg border border-border bg-surface" data-interview-list><p class="p-4 font-body-sm text-body-sm text-text-muted">Loading interviews…</p></div>
</div>
